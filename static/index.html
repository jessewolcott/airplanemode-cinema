<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0d">
<title>Cinema · AirplaneMode</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23e2685c'/%3E%3Cpath d='M6 4.5v7l5.5-3.5z' fill='%231c0c0a'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0b0d; --panel: #151519; --panel2: #1c1c22; --line: #26262e; --line2: #34343e;
    --ink: #ece7dc; --dim: #8e8a84; --accent: #e2685c; --accent2: #f08a7e; --amber: #f2b34b;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- library ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; max-width: 1400px; margin: 0 auto; }
  .top { padding-top: max(18px, env(safe-area-inset-top)); padding-right: max(20px, env(safe-area-inset-right)); padding-left: max(20px, env(safe-area-inset-left)); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.35rem; letter-spacing: -.01em; text-decoration: none; }
  .brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
  .brand .mark svg { width: 12px; height: 12px; margin-left: 2px; }
  .top nav { display: flex; align-items: center; gap: 8px; flex: none; }
  .pillbtn { white-space: nowrap; font: .8rem var(--mono); color: var(--dim); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: none; cursor: pointer; }
  .pillbtn:hover { color: var(--ink); border-color: var(--dim); }
  /* AirplaneMode home button (app contract item 10): top right of every view, the player too */
  a.am-home { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; color: var(--dim);
              background: var(--panel); border: 1px solid var(--line); text-decoration: none; transition: color .15s, border-color .15s, background .15s, opacity .3s; }
  a.am-home:hover { color: var(--ink); border-color: var(--dim); }
  a.am-home:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; color: var(--ink); }
  .pbar a.am-home { margin-left: auto; border-radius: 50%; border: 0; background: #ffffff1a; color: var(--ink); }
  .pbar a.am-home:hover { background: #ffffff33; }
  .lib { max-width: 1400px; margin: 0 auto; padding: 8px 0 60px; }
  .crumbs { padding: 8px 20px 0; font: .78rem var(--mono); color: var(--dim); display: flex; gap: 6px; flex-wrap: wrap; }
  .crumbs a { color: var(--dim); text-decoration: none; } .crumbs a:hover { color: var(--ink); }
  .crumbs b { color: var(--ink); font-weight: 600; }
  .shelf { margin-top: 22px; }
  .shelf h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 20px 10px; font-size: 1.12rem; letter-spacing: -.005em; }
  .shelf h2 a { text-decoration: none; }
  .shelf h2 a:hover { color: var(--accent2); }
  .shelf h2 small { color: var(--dim); font: .74rem var(--mono); font-weight: 400; }
  .row { display: flex; gap: 12px; overflow-x: auto; padding: 4px 20px 14px; scroll-snap-type: x proximity; scroll-padding-inline: 20px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px 12px; padding: 4px 20px 14px; }
  .grid.audio { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); text-decoration: none; font-size: .9rem; }
  .chip:hover { border-color: var(--line2); }
  .chip small { color: var(--dim); font: .72rem var(--mono); }

  .card { flex: none; width: 260px; scroll-snap-align: start; text-decoration: none; display: block; border-radius: 10px; outline: none; }
  .grid .card { width: auto; }
  .card.sq { width: 170px; }
  .grid .card.sq { width: auto; }
  .poster { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--panel2); border: 1px solid var(--line); transition: transform .18s, border-color .18s, box-shadow .18s; }
  .card.sq .poster { aspect-ratio: 1; }
  .card:hover .poster, .card:focus-visible .poster { transform: translateY(-2px) scale(1.015); border-color: var(--accent); box-shadow: 0 14px 30px -14px #000; }
  .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
  .poster img.on { opacity: 1; }
  .poster .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; text-align: center; font-weight: 700; font-size: 1.05rem; line-height: 1.2; color: #fff9; }
  .poster .ph svg { width: 34%; height: 34%; opacity: .55; }
  .poster .dur { position: absolute; right: 7px; bottom: 9px; font: .7rem var(--mono); background: #000b; padding: 1px 6px; border-radius: 4px; }
  .poster .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #fff2; }
  .poster .prog i { display: block; height: 100%; background: var(--accent); }
  .poster .hover { position: absolute; inset: 0; display: grid; place-items: center; background: #0006; opacity: 0; transition: opacity .18s; }
  .card:hover .hover, .card:focus-visible .hover { opacity: 1; }
  .hover span { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 6px 20px #0008; }
  .hover svg { width: 16px; height: 16px; margin-left: 3px; }
  .card .t { margin-top: 8px; font-weight: 600; font-size: .93rem; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .m { color: var(--dim); font-size: .78rem; margin-top: 2px; }
  .card.cant { opacity: .5; }

  .empty { max-width: 560px; margin: 70px auto; padding: 0 20px; text-align: center; color: var(--dim); }
  .empty .big { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 20px; background: var(--panel2); display: grid; place-items: center; }
  .empty .big svg { width: 26px; height: 26px; margin-left: 4px; }
  .empty h2 { color: var(--ink); margin: 0 0 8px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font: 600 .95rem var(--sans); padding: 10px 16px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--accent); color: #1c0c0a; }
  .btn svg { width: 11px; height: 12px; flex: none; }
  .cta { padding: 0 20px 8px; }
  .btn.ghost { border-color: var(--line2); background: transparent; }

  /* ---------- player ---------- */
  .player { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; z-index: 5; }
  .pbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
          padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
  .pbar::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(#000d, #0000); pointer-events: none; }
  .pbar::before, .pbar > * { transition: opacity .3s; }
  /* idle (video playing): the bar fades out, but the home button stays, dimmed, and still works */
  .player.idle .pbar { pointer-events: none; }
  .player.idle .pbar::before, .player.idle .pbar > :not(.am-home) { opacity: 0; }
  .player.idle .pbar a.am-home { pointer-events: auto; opacity: .6; background: #0000004d; }
  .player.idle .pbar a.am-home:hover, .player.idle .pbar a.am-home:focus-visible { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { a.am-home, .pbar::before, .pbar > * { transition: none; } }
  .back { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #ffffff1a; cursor: pointer; display: grid; place-items: center; flex: none; }
  .back:hover { background: #ffffff33; }
  .back svg { width: 18px; height: 18px; }
  .ptitle { min-width: 0; }
  .ptitle b { display: block; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ptitle small { color: #fffa; font-size: .8rem; }
  .stage { flex: 1; display: grid; place-items: center; min-height: 0; }
  .stage video { width: 100%; height: 100%; max-height: 100vh; background: #000; }
  .toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: #1c1c22ee; border: 1px solid var(--line2); border-radius: 99px; padding: 8px 8px 8px 16px; display: flex; gap: 10px; align-items: center; font-size: .9rem; z-index: 3; white-space: nowrap; box-shadow: 0 10px 30px #000a; }
  .toast button { border: 0; border-radius: 99px; padding: 6px 12px; background: var(--accent); color: #1c0c0a; font-weight: 600; cursor: pointer; }
  .toast button.ghost { background: #ffffff1a; color: var(--ink); }
  .next { position: absolute; right: 20px; bottom: 90px; width: min(340px, calc(100vw - 40px)); background: #151519f2; border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; z-index: 3; box-shadow: 0 16px 40px #000c; }
  .next .np { aspect-ratio: 16 / 9; background: var(--panel2) center / cover; position: relative; }
  .next .np .ring { position: absolute; inset: 0; display: grid; place-items: center; background: #0007; font: 700 1.6rem var(--mono); }
  .next .nb { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .next .nb div { min-width: 0; } .next .nb small { color: var(--dim); font-size: .75rem; display: block; }
  .next .nb b { display: block; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next .nb button { border: 0; border-radius: 7px; padding: 7px 12px; cursor: pointer; font-weight: 600; flex: none; }
  .next .play { background: var(--accent); color: #1c0c0a; }
  .next .x { background: #ffffff1a; }

  /* audio */
  .audio { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 18px; overflow: auto; padding: 76px 20px 30px; max-width: 760px; width: 100%; margin: 0 auto; }
  .art { width: min(300px, 70vw); aspect-ratio: 1; margin: 0 auto; border-radius: 18px; display: grid; place-items: center; box-shadow: 0 30px 60px -20px #000; }
  .art svg { width: 30%; height: 30%; opacity: .8; }
  .audio h1 { text-align: center; margin: 0; font-size: 1.35rem; line-height: 1.25; }
  .audio .sub { text-align: center; color: var(--dim); margin-top: -12px; font-size: .9rem; }
  .audio audio { width: 100%; }
  .tracks { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tracks button { display: flex; width: 100%; gap: 12px; align-items: center; text-align: left; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; }
  .tracks button:last-child { border-bottom: 0; }
  .tracks button:hover { background: var(--panel2); }
  .tracks button.now { color: var(--accent2); }
  .tracks .n { font: .78rem var(--mono); color: var(--dim); width: 22px; text-align: right; flex: none; }
  .tracks .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tracks .d { font: .75rem var(--mono); color: var(--dim); }
  /* shows */
  .showhead { display: grid; grid-template-columns: minmax(0, 340px) 1fr; gap: 22px; align-items: end; padding: 18px 20px 4px; }
  .showhead .poster { aspect-ratio: 16 / 9; }
  .showhead h1 { margin: 0 0 4px; font-size: 1.7rem; letter-spacing: -.01em; line-height: 1.15; }
  .showhead .sub { color: var(--dim); font-size: .9rem; margin-bottom: 14px; }
  @media (max-width: 600px) { .showhead { grid-template-columns: 1fr; padding: 14px 16px 4px; gap: 14px; } .showhead h1 { font-size: 1.4rem; } }
  .tabs { display: flex; gap: 6px; padding: 18px 20px 6px; overflow-x: auto; scrollbar-width: none; }
  .tabs a { flex: none; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); text-decoration: none; font-size: .88rem; color: var(--dim); }
  .tabs a.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  .eps { padding: 6px 20px 30px; display: grid; gap: 4px; }
  .ep { display: grid; grid-template-columns: 168px 1fr; gap: 14px; align-items: center; padding: 8px; border-radius: 10px; text-decoration: none; }
  .ep:hover, .ep:focus-visible { background: var(--panel); outline: none; }
  .ep.now { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  .ep .poster { aspect-ratio: 16 / 9; border-radius: 8px; }
  .ep b { display: block; font-size: .95rem; line-height: 1.3; }
  .ep small { color: var(--dim); font-size: .8rem; }
  .ep.cant { opacity: .5; }
  @media (max-width: 600px) { .ep { grid-template-columns: 128px 1fr; gap: 12px; } .tabs, .eps { padding-left: 16px; padding-right: 16px; } }
  .note { text-align: center; color: var(--dim); font-size: .85rem; padding: 0 20px; }
  /* Sync Watch */
  .together { display: flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px 0 11px; border-radius: 99px; border: 0; background: #ffffff1a;
              cursor: pointer; font-weight: 600; font-size: .88rem; flex: none; margin-left: auto; white-space: nowrap; }
  .together:hover { background: #ffffff33; }
  .together:focus-visible, .party button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .together.on { background: var(--accent); color: #1c0c0a; }
  .together svg { width: 18px; height: 18px; flex: none; }
  .together + a.am-home { margin-left: 0; }
  @media (max-width: 600px) { .together:not(.on) .lbl { display: none; } .together:not(.on) { padding: 0 11px; } }
  .party { position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 54px); right: max(16px, env(safe-area-inset-right)); width: min(330px, calc(100vw - 32px));
           background: #151519f7; border: 1px solid var(--line2); border-radius: 14px; padding: 14px 16px; z-index: 4; box-shadow: 0 16px 40px #000c; }
  .party h3 { margin: 0 0 4px; font-size: 1rem; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .party .code { font: 700 .85rem var(--mono); color: var(--amber); letter-spacing: .14em; }
  .party p { margin: 6px 0; color: var(--dim); font-size: .85rem; line-height: 1.45; }
  .party p a { color: var(--accent2); }
  .party ul { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 7px; max-height: 38vh; overflow: auto; }
  .party li { display: flex; align-items: center; gap: 10px; font-size: .92rem; }
  .party li small { color: var(--dim); }
  .party li .av { width: 30px; height: 30px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-size: 1.05rem; font-weight: 700; flex: none; }
  .party li.away { opacity: .5; }
  .party .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  .party button { border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 600; }
  .party .go { background: var(--accent); color: #1c0c0a; }
  .party .ghost { background: #ffffff1a; }
  .toast.fixed { position: fixed; z-index: 9; padding-right: 16px; }
  @media (max-width: 600px) { .card { width: 200px; } .card.sq { width: 140px; } .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } .top { padding: 14px 16px 4px; } .shelf h2 { margin: 0 16px 8px; } .row, .grid, .chips { padding-left: 16px; padding-right: 16px; } .row { scroll-padding-inline: 16px; } .cta { padding: 0 16px 8px; } .crumbs { padding: 8px 16px 0; } }
</style>
</head>
<body>

<div id="libView">
  <header class="top">
    <a class="brand" href="#"><span class="mark"><svg viewBox="0 0 12 14"><path d="M1 1l10 6-10 6z" fill="#1c0c0a"/></svg></span>Cinema</a>
    <nav><a class="pillbtn" id="dropLink" href="../drop/">add in Drop</a>
      <a class="am-home" href="../" aria-label="AirplaneMode home" title="AirplaneMode home">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
        </svg>
      </a>
    </nav>
  </header>
  <div class="crumbs" id="crumbs" hidden></div>
  <main class="lib" id="lib"><p class="empty">Loading the library…</p></main>
</div>

<div class="player" id="player" hidden>
  <div class="pbar">
    <button class="back" id="back" type="button" aria-label="Back to the library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ptitle"><b id="pTitle"></b><small id="pSub"></small></div>
    <button class="together" id="together" type="button" aria-expanded="false" aria-controls="party" title="Watch together on this hotspot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.4.2 4 1.8 4.5 4.4"/></svg>
      <span class="lbl" id="togetherLbl">Watch together</span>
    </button>
    <a class="am-home" href="../" aria-label="AirplaneMode home" title="AirplaneMode home">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
      </svg>
    </a>
  </div>
  <div class="stage" id="stage"></div>
  <div class="party" id="party" hidden role="dialog" aria-label="Watch together"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PLAY = '<svg viewBox="0 0 12 14"><path d="M1 1l10 6-10 6z" fill="#1c0c0a"/></svg>';
const NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
const FILM = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>';
const nat = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
let lib = null, byId = new Map(), folderById = new Map();

// ---- per-device memory: where you are in each file, and durations we've seen ----
const mem = {
  get(k, d = null) { try { const v = localStorage.getItem("cinema." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cinema." + k, JSON.stringify(v)); } catch {} },
};
const pos = id => mem.get("p." + id);          // {t, d, at}
const savePos = (id, t, d) => { if (d > 0) mem.set("p." + id, { t, d, at: Date.now() }); };
// the last 25 s of a film are credits; a short clip isn't finished until it nearly is
const finished = p => p && p.d && (p.t / p.d > 0.95 || (p.d > 300 && p.d - p.t < 25));
const started = p => p && p.d && p.t > Math.min(15, p.d * 0.1) && !finished(p);

function tidy(name) {
  return name.replace(/\.[a-z0-9]{2,5}$/i, "").replace(/[._]+/g, " ").replace(/\s{2,}/g, " ").trim() || name;
}
function clock(s) {
  s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`;
}
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const gradient = s => `linear-gradient(135deg, hsl(${hue(s)} 35% 26%), hsl(${(hue(s) + 40) % 360} 40% 14%))`;
function playable(m) { try { return document.createElement(m.kind).canPlayType(m.type) !== ""; } catch { return false; } }
const src = m => lib.drop_path + "api/files/" + m.id;
const inFolder = fid => lib.media.filter(m => (m.parent || null) === fid).sort(nat);
const subfolders = fid => lib.folders.filter(f => (f.parent || null) === fid).sort(nat);
function folderPath(fid) { const out = []; let f = folderById.get(fid); while (f && out.length < 12) { out.unshift(f); f = folderById.get(f.parent); } return out; }
const folderLabel = fid => folderPath(fid).map(f => f.name).join(" / ");
function countBelow(fid) { let n = inFolder(fid).length; for (const s of subfolders(fid)) n += countBelow(s.id); return n; }

// ---- TV series: a folder of episodes, or of season folders, is a show ----
// Episode numbers come from file names (S01E02, 1x02, Episode 2); seasons from folder names
// ("Season 1", "S2", "Series 3", "Specials" = 0) or, failing that, from the file name.
const EP_RES = [
  [/\bS(\d{1,2})[ ._-]*E(\d{1,3})\b/i, m => [+m[1], +m[2]]],
  [/\b(\d{1,2})x(\d{2,3})\b/i, m => [+m[1], +m[2]]],
  [/\b(?:episode|ep)[ ._-]*(\d{1,3})\b/i, m => [null, +m[1]]],
  [/\bE(\d{1,3})\b/, m => [null, +m[1]]],
];
function parseEp(name) {
  const base = name.replace(/\.[a-z0-9]{2,5}$/i, "").replace(/[._]+/g, " ");
  for (const [re, f] of EP_RES) {
    const m = re.exec(base);
    if (m) {
      const [season, ep] = f(m);
      const title = base.slice(m.index + m[0].length).replace(/^[\s\-–—:]+/, "").replace(/\s{2,}/g, " ").trim();
      return { season, ep, title: title || null };
    }
  }
  return null;
}
function seasonOf(name) {
  const n = name.trim();
  if (/^(specials?|extras?)$/i.test(n)) return 0;
  const m = /^(?:season|series|staffel|saison|temporada|s)?[ ._-]*(\d{1,2})$/i.exec(n) || /\b(?:season|series)[ ._-]*(\d{1,2})\b/i.exec(n);
  return m ? +m[1] : null;
}
let shows = new Map();      // show folder id -> {id, name, episodes (in watch order), seasons}
function isShow(f) {
  const epFiles = inFolder(f.id).filter(m => parseEp(m.name)).length;
  const seasonKids = subfolders(f.id).filter(k => countBelow(k.id) && (seasonOf(k.name) !== null || inFolder(k.id).some(m => parseEp(m.name))));
  return seasonKids.length > 0 || epFiles >= 2;
}
function buildShows() {
  shows = new Map();
  lib.media.forEach(m => { delete m.show; });
  const walk = fid => {
    for (const f of subfolders(fid)) {
      if (isShow(f)) addShow(f); else walk(f.id);       // a show's own subfolders are its seasons
    }
  };
  walk(null);
}
function addShow(f) {
  const eps = [];
  const collect = (fid, season, idx) => {
    for (const m of inFolder(fid)) {
      const e = parseEp(m.name) || {};
      Object.assign(m, { show: f.id, season: season ?? e.season ?? idx ?? 1, ep: e.ep ?? null, epTitle: e.title ?? null });
      eps.push(m);
    }
    subfolders(fid).forEach((k, i) => collect(k.id, season ?? seasonOf(k.name) ?? (fid === f.id ? null : season), season ?? seasonOf(k.name) ?? i + 1));
  };
  collect(f.id, null, null);
  // seasons in order, specials (0) last; episodes by number, then by name
  const sk = x => x === 0 ? 999 : x;
  eps.sort((a, b) => sk(a.season) - sk(b.season) || (a.ep ?? 1e6) - (b.ep ?? 1e6) || nat(a, b));
  const seasons = [...new Set(eps.map(m => m.season))];
  shows.set(f.id, { id: f.id, name: f.name, episodes: eps, seasons });
}
const seasonName = n => n === 0 ? "Specials" : `Season ${n}`;
function epShort(m) {   // "E2 · Pilot"
  if (m.ep == null) return m.epTitle || tidy(m.name);
  return `E${m.ep}${m.epTitle ? " · " + m.epTitle : ""}`;
}
function epLong(m) {    // "S1 · E2 · Pilot"
  const sh = shows.get(m.show);
  return (sh && sh.seasons.length > 1 || m.season > 1 ? (m.season === 0 ? "Special · " : `S${m.season} · `) : "") + epShort(m);
}
const titleOf = m => m.show ? epLong(m) : tidy(m.name);
// where this device is in a show: the episode to continue, the next one, or the first
function showState(sh) {
  const seen = sh.episodes.map(m => [m, pos(m.id)]).filter(([, p]) => p);
  if (!seen.length) return { m: sh.episodes.find(playable) || sh.episodes[0], mode: "start", at: 0 };
  const [last, p] = seen.sort((a, b) => b[1].at - a[1].at)[0];
  if (!finished(p)) return { m: last, mode: "continue", at: p.at };
  const next = sh.episodes.slice(sh.episodes.indexOf(last) + 1).find(e => !finished(pos(e.id)));
  return next ? { m: next, mode: "next", at: p.at } : { m: last, mode: "done", at: p.at };
}

// ---- Sync Watch: where the party is, and what this player should do about it ----
// st: the party's state from the box ({playing, pos, at}); now: the box's clock in ms (our
// clock + offset); local: this player ({t, paused, ended}). Small drift is closed by playing
// up to 10% faster or slower (browsers keep the pitch); more than a second, by jumping.
const partyPos = (st, now) => st.pos + (st.playing ? Math.max(0, now - st.at) / 1000 : 0);
function syncStep(st, now, local) {
  const want = partyPos(st, now), diff = want - local.t;
  if (!st.playing) return { pause: !local.paused, play: false, seek: Math.abs(diff) > 0.3 ? want : null, rate: 1 };
  if (Math.abs(diff) > 1) return { pause: false, play: local.paused && !local.ended, seek: want, rate: 1 };
  const rate = Math.abs(diff) < 0.08 ? 1 : 1 + Math.max(-0.1, Math.min(0.1, diff * 0.5));
  return { pause: false, play: local.paused && !local.ended, seek: null, rate };
}
// Was this player event caused by us following the party (ignore it) or by the person (tell the party)?
function ownEvent(kind, st, now, local) {
  if (kind === "play") return st.playing;
  if (kind === "pause") return !st.playing || local.ended;
  return Math.abs(local.t - partyPos(st, now)) < 1.5;        // "seeking" (t is the target): our own correction
}
// The box's clock minus ours, from the round trip with the shortest time (the least skewed one).
const clockOffset = samples => [...samples].sort((a, b) => a.rtt - b.rtt)[0].offset;

// ---- library ----
async function load() {
  try {
    const r = await fetch("api/library", { cache: "no-store" });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    lib = await r.json();
  } catch (e) {
    $("#lib").innerHTML = `<div class="empty"><div class="big">${PLAY}</div><h2>The library isn't reachable</h2><p>${esc(e.message)}</p><button class="btn ghost" onclick="load()">Try again</button></div>`;
    return;
  }
  byId = new Map(lib.media.map(m => [m.id, m]));
  folderById = new Map(lib.folders.map(f => [f.id, f]));
  buildShows();
  $("#dropLink").href = lib.drop_path;
  await loadParties();
  const saved = !restored && mem.get("party");
  restored = true;
  // a refresh in the middle of a watch party: back into it
  if (saved && /^play=/.test(location.hash.slice(1)) && !party) { joinParty(saved.code); }
  route();
  posterQueue();
}
let restored = false;

function posterBox(m, art, extra = "") {
  const sq = m.kind === "audio";
  return `<div class="poster" style="background:${gradient(art)}">
      <div class="ph">${sq ? NOTE : m.poster ? "" : FILM}</div>
      ${m.poster ? `<img src="api/posters/${m.id}" alt="" loading="lazy" onload="this.classList.add('on')">` : ""}${extra}
    </div>`;
}
const artFor = m => m.show ? shows.get(m.show).name : m.parent ? folderLabel(m.parent) : m.name;
function card(m, opts = {}) {
  const p = pos(m.id), sq = m.kind === "audio", can = playable(m);
  const dur = (p && p.d) || mem.get("d." + m.id);
  // in a folder's shelf the folder name is already the heading; elsewhere (Continue) say where it's from
  const where = opts.where ? (m.show ? epLong(m) : folderLabel(m.parent)) : "";
  const meta = !can ? "won't play on this device" : [opts.status || (started(p) ? `${clock(p.d - p.t)} left` : finished(p) ? "watched" : ""), where].filter(Boolean).join(" · ");
  return `<a class="card${sq ? " sq" : ""}${can ? "" : " cant"}" href="${esc(opts.href || "#play=" + m.id)}" title="${esc(m.name)}">
    <div class="poster" style="background:${gradient(artFor(m))}">
      <div class="ph">${sq ? NOTE : m.poster ? "" : FILM}</div>
      ${m.poster ? `<img src="api/posters/${m.id}" alt="" loading="lazy" onload="this.classList.add('on')">` : ""}
      ${dur && !sq ? `<span class="dur">${clock(dur)}</span>` : ""}
      ${started(p) ? `<div class="prog"><i style="width:${(100 * p.t / p.d).toFixed(1)}%"></i></div>` : ""}
      <div class="hover"><span>${PLAY}</span></div>
    </div>
    <div class="t">${esc(opts.title || titleOf(m))}</div>
    ${meta ? `<div class="m">${esc(meta)}</div>` : ""}
  </a>`;
}
function showCard(sh) {
  const st = showState(sh), m = st.m;
  const face = m.poster ? m : sh.episodes.find(e => e.poster) || m;
  const meta = st.mode === "continue" ? `${epLong(m)} · in progress` : st.mode === "next" ? `Next: ${epLong(m)}` : st.mode === "done" ? "watched"
    : `${sh.seasons.length > 1 ? sh.seasons.filter(x => x).length + " seasons · " : ""}${sh.episodes.length} episode${sh.episodes.length === 1 ? "" : "s"}`;
  return `<a class="card" href="#show=${sh.id}" title="${esc(sh.name)}">
    ${posterBox(face, sh.name, `<div class="hover"><span>${PLAY}</span></div>`)}
    <div class="t">${esc(sh.name)}</div><div class="m">${esc(meta)}</div>
  </a>`;
}

function renderHome() {
  $("#crumbs").hidden = true;
  if (!lib.media.length) {
    $("#lib").innerHTML = `<div class="empty"><div class="big" style="background:var(--accent)">${PLAY}</div>
      <h2>Nothing to watch yet</h2>
      <p>Cinema plays the videos and music on Drop. Load films, shows or albums into Drop before the trip (folders become shelves here), and tap <b>keep</b> so they stay.</p>
      <p><a class="btn primary" href="${esc(lib.drop_path)}">Open Drop</a></p></div>`;
    return;
  }
  // Continue: films/songs in progress, and one card per show (its episode in progress, or the next)
  const cont = [
    ...lib.media.filter(m => !m.show && started(pos(m.id))).map(m => ({ at: pos(m.id).at, html: card(m, { where: true }) })),
    ...[...shows.values()].map(sh => [sh, showState(sh)]).filter(([, st]) => st.mode === "continue" || st.mode === "next")
      .map(([sh, st]) => ({ at: st.at, html: card(st.m, { title: sh.name, where: true, status: st.mode === "next" ? "Next up" : "" }) })),
  ].sort((a, b) => b.at - a.at).slice(0, 12);
  let html = "";
  // watch parties on this hotspot: tap one to join in, in step with everyone there
  const live = partyList.filter(p => byId.has(p.item));
  if (live.length) html += `<section class="shelf"><h2>Watching together<small>${live.length}</small></h2><div class="row">${live.map(p => card(byId.get(p.item), {
    href: "#watch=" + p.code, where: true, title: byId.get(p.item).show ? shows.get(byId.get(p.item).show).name : undefined, status: `${p.avatar ? p.avatar + " " : ""}${p.host} · ${p.watching} watching${p.playing ? "" : " · paused"}` })).join("")}</div></section>`;
  if (cont.length) html += `<section class="shelf"><h2>Continue<small>${cont.length}</small></h2><div class="row">${cont.map(c => c.html).join("")}</div></section>`;
  if (shows.size) {
    const list = [...shows.values()].sort(nat);
    html += `<section class="shelf"><h2>Shows<small>${list.length}</small></h2><div class="row">${list.map(showCard).join("")}</div></section>`;
  }
  // one shelf per (non-show) folder that holds media directly, in folder order; loose files last
  const order = [];
  const walk = fid => { for (const f of subfolders(fid)) { if (shows.has(f.id)) continue; if (inFolder(f.id).length) order.push(f.id); walk(f.id); } };
  walk(null);
  for (const fid of order) html += shelf(folderLabel(fid), inFolder(fid), fid, "row");
  const loose = inFolder(null);
  if (loose.length) html += shelf(order.length || shows.size ? "Everything else" : "On Drop", loose, null, "row");
  $("#lib").innerHTML = html;
}
function shelf(title, list, fid, layout, opts = {}) {
  const audio = list.every(m => m.kind === "audio");
  return `<section class="shelf"><h2>${fid ? `<a href="#folder=${fid}">${esc(title)} ›</a>` : esc(title)}<small>${list.length}</small></h2>
    <div class="${layout}${layout === "grid" && audio ? " audio" : ""}">${list.map(m => card(m, opts)).join("")}</div></section>`;
}
function renderFolder(fid) {
  const f = folderById.get(fid); if (!f) return go("");
  if (shows.has(fid)) return go("show=" + fid);
  const parts = folderPath(fid);
  $("#crumbs").hidden = false;
  $("#crumbs").innerHTML = `<a href="#">Library</a>` + parts.map((p, i) => ` / ` + (i === parts.length - 1 ? `<b>${esc(p.name)}</b>` : `<a href="#folder=${p.id}">${esc(p.name)}</a>`)).join("");
  const subs = subfolders(fid).filter(s => countBelow(s.id));
  const list = inFolder(fid);
  let html = subs.length ? `<div class="chips" style="margin-top:16px">${subs.map(s => `<a class="chip" href="#${shows.has(s.id) ? "show" : "folder"}=${s.id}">${esc(s.name)} <small>${countBelow(s.id)}</small></a>`).join("")}</div>` : "";
  if (list.length) {
    const first = list.find(m => !finished(pos(m.id)) && playable(m)) || list[0];
    html += `<section class="shelf"><h2>${esc(f.name)}<small>${list.length}</small></h2>
      <div class="cta"><a class="btn primary" href="#play=${first.id}">${PLAY} ${started(pos(first.id)) ? "Continue" : "Play"} ${esc(tidy(first.name))}</a></div>
      <div class="grid${list.every(m => m.kind === "audio") ? " audio" : ""}">${list.map(m => card(m)).join("")}</div></section>`;
  }
  if (!subs.length && !list.length) html += `<div class="empty"><p>Nothing playable in this folder.</p></div>`;
  $("#lib").innerHTML = html;
}

function renderShow(id, wantSeason) {
  const sh = shows.get(id); if (!sh) return go("");
  const st = showState(sh);
  const season = sh.seasons.includes(wantSeason) ? wantSeason : st.m.season;
  const parts = folderPath(id);
  $("#crumbs").hidden = false;
  $("#crumbs").innerHTML = `<a href="#">Library</a>` + parts.slice(0, -1).map(p => ` / <a href="#folder=${p.id}">${esc(p.name)}</a>`).join("") + ` / <b>${esc(sh.name)}</b>`;
  const face = st.m.poster ? st.m : sh.episodes.find(e => e.poster) || st.m;
  const label = st.mode === "continue" ? `Continue ${epLong(st.m)}` : st.mode === "next" ? `Play ${epLong(st.m)}` : st.mode === "done" ? "Watch again" : `Play ${epLong(st.m)}`;
  const target = st.mode === "done" ? sh.episodes[0] : st.m;
  const n = sh.episodes.length, ns = sh.seasons.filter(x => x).length;
  let html = `<div class="showhead">${posterBox(face, sh.name)}
    <div><h1>${esc(sh.name)}</h1><div class="sub">${ns > 1 ? ns + " seasons · " : ""}${n} episode${n === 1 ? "" : "s"}</div>
    <a class="btn primary" href="#play=${target.id}">${PLAY} ${esc(label)}</a></div></div>`;
  if (sh.seasons.length > 1) html += `<nav class="tabs">${sh.seasons.map(x => `<a href="#show=${id}&s=${x}" class="${x === season ? "on" : ""}">${seasonName(x)}</a>`).join("")}</nav>`;
  const list = sh.episodes.filter(m => m.season === season);
  html += `<div class="eps">${list.map(m => {
    const p = pos(m.id), dur = (p && p.d) || mem.get("d." + m.id), can = playable(m);
    const status = !can ? "won't play on this device" : started(p) ? `${clock(p.d - p.t)} left` : finished(p) ? "watched" : dur ? clock(dur) : "";
    const bar = started(p) ? `<div class="prog"><i style="width:${(100 * p.t / p.d).toFixed(1)}%"></i></div>` : "";
    return `<a class="ep${m === st.m && st.mode !== "done" ? " now" : ""}${can ? "" : " cant"}" href="#play=${m.id}" title="${esc(m.name)}">
      ${posterBox(m, sh.name, bar)}<div><b>${esc(epShort(m))}</b><small>${esc(status)}</small></div></a>`;
  }).join("")}</div>`;
  $("#lib").innerHTML = html;
}

// ---- routing: #play=<id> (Drop links here), #folder=<id>, #show=<id>[&s=<season>], or the library ----
function go(hash) { if (location.hash.slice(1) !== hash) location.hash = hash; else route(); }
function route() {
  if (!lib) return;
  const h = location.hash.slice(1), m = /^(play|folder|show)=([0-9a-f]{16})(?:&s=(\d{1,3}))?$/.exec(h);
  const w = /^watch=([A-Za-z]{4})$/.exec(h);
  if (w) return joinParty(w[1].toUpperCase());
  if (m && m[1] === "play" && byId.has(m[2])) return openPlayer(byId.get(m[2]));
  if (party) leaveParty();              // out of the player: out of the party
  if (m && m[1] === "play") return closePlayer(), renderHome();
  closePlayer();
  if (m && m[1] === "show") renderShow(m[2], m[3] != null ? +m[3] : null);
  else m ? renderFolder(m[2]) : renderHome();
  window.scrollTo(0, scrollMem[h] || 0);
}
const scrollMem = {};
window.addEventListener("hashchange", route);
window.addEventListener("scroll", () => { if ($("#player").hidden) scrollMem[location.hash.slice(1)] = window.scrollY; }, { passive: true });

// ---- player ----
let media = null, current = null, saveTimer = null, nextTimer = null, idleTimer = null;
function openPlayer(m) {
  closePlayer(true);
  current = m;
  const sh = m.show && shows.get(m.show);
  document.title = (sh ? `${sh.name} · ${epLong(m)}` : tidy(m.name)) + " · Cinema";
  $("#libView").hidden = true;
  $("#player").hidden = false;
  $("#pTitle").textContent = sh ? sh.name : tidy(m.name);
  $("#pSub").textContent = sh ? epLong(m) : folderLabel(m.parent) || "Drop";
  // a show plays straight on into the next season; otherwise the folder is the playlist
  const list = sh ? sh.episodes : inFolder(m.parent), idx = list.indexOf(m);
  const stage = $("#stage");
  const noSave = m.download ? "" : ' controlslist="nodownload" oncontextmenu="return false"';
  if (m.kind === "video") {
    stage.className = "stage";
    stage.innerHTML = `<video id="media" controls${party ? "" : " autoplay"} playsinline preload="auto"${noSave}></video>`;
  } else {
    stage.className = "audio";
    stage.innerHTML = `<div class="art" style="background:${gradient(m.parent ? folderLabel(m.parent) : m.name)}">${NOTE}</div>
      <h1>${esc(titleOf(m))}</h1><div class="sub">${esc(sh ? sh.name : folderLabel(m.parent) || "Drop")}${list.length > 1 ? ` · ${idx + 1} of ${list.length}` : ""}</div>
      <audio id="media" controls${party ? "" : " autoplay"} preload="auto"${noSave}></audio>
      ${list.length > 1 ? `<div class="tracks">${list.map((t, i) => `<button type="button" data-track="${t.id}" class="${t === m ? "now" : ""}"><span class="n">${t === m ? "▶" : i + 1}</span><span class="nm">${esc(titleOf(t))}</span><span class="d">${mem.get("d." + t.id) ? clock(mem.get("d." + t.id)) : ""}</span></button>`).join("")}</div>` : ""}`;
    stage.querySelectorAll("[data-track]").forEach(b => b.onclick = () => go("play=" + b.dataset.track));
  }
  if (!playable(m)) stage.insertAdjacentHTML("beforeend", `<p class="note">This device's browser may not play ${esc(m.type)}. Try another device, or a file in MP4 (H.264) or MP3.</p>`);
  media = $("#media");
  media.src = src(m);
  const p = pos(m.id);
  media.addEventListener("loadedmetadata", () => {
    mem.set("d." + m.id, media.duration);
    if (party) return syncNow();           // in a watch party the party says where we are
    if (started(p)) {
      media.currentTime = p.t;
      toast(`Picked up at ${clock(p.t)}`, "Start over", () => { media.currentTime = 0; });
    }
  }, { once: true });
  media.addEventListener("pause", () => { save(); armIdle(); });
  media.addEventListener("ended", () => { save(); upNext(list[idx + 1]); });
  media.addEventListener("play", () => { hideNext(); armIdle(); });
  media.addEventListener("error", () => toast("This file won't play here.", "Back", () => history.length > 1 ? history.back() : go("")));
  // "seeking", not "seeked": the sync loop would pull a person's seek back before it finished
  ["play", "pause", "seeking"].forEach(k => media.addEventListener(k, () => tellParty(k)));
  if (party && party.st.item !== m.id) partyAct({ type: "item", item: m.id });   // next episode, a track, a card
  renderParty();
  saveTimer = setInterval(save, 5000);
  if (!party) media.play?.().catch(() => {});   // autoplay can be refused (iOS with sound): the controls are there. In a party, syncNow plays
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: titleOf(m), artist: sh ? sh.name : folderLabel(m.parent) || "AirplaneMode", album: "Cinema",
      artwork: m.poster ? [{ src: "api/posters/" + m.id, sizes: "480x270", type: "image/jpeg" }] : [] });
    navigator.mediaSession.setActionHandler("nexttrack", list[idx + 1] ? () => go("play=" + list[idx + 1].id) : null);
    navigator.mediaSession.setActionHandler("previoustrack", list[idx - 1] ? () => go("play=" + list[idx - 1].id) : null);
  }
  armIdle();
}
function save() { if (media && current && media.duration) savePos(current.id, media.currentTime, media.duration); }
function closePlayer(keepView) {
  if (media) { save(); media.pause(); media.removeAttribute("src"); media.load(); }
  clearInterval(saveTimer); clearTimeout(nextTimer); clearTimeout(idleTimer);
  media = current = null;
  $("#stage").innerHTML = "";
  if (!keepView) { $("#player").hidden = true; $("#libView").hidden = false; document.title = "Cinema · AirplaneMode"; }
}
$("#back").onclick = () => {
  if (party && party.st.seats.some(s => !s.you && !s.away) && !confirm("Leave the watch party? The others keep watching.")) return;
  if (current && current.show) return go(`show=${current.show}&s=${current.season}`);
  const fid = current && current.parent;
  go(fid ? "folder=" + fid : "");
};
window.addEventListener("pagehide", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

function toast(text, label, fn) {
  $(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `<span>${esc(text)}</span><button type="button">${esc(label)}</button>`;
  t.querySelector("button").onclick = () => { fn(); t.remove(); };
  $("#player").append(t);
  setTimeout(() => t.remove(), 7000);
}
function upNext(n) {
  if (!n || !playable(n)) return;
  if (n.kind === "audio") return go("play=" + n.id);      // albums just keep going
  let left = 8;
  const box = document.createElement("div"); box.className = "next";
  box.innerHTML = `<div class="np" style="background-image:${n.poster ? `url(api/posters/${n.id})` : gradient(n.name)}"><div class="ring">${left}</div></div>
    <div class="nb"><div><small>Up next${n.show && current && n.season !== current.season ? " · " + seasonName(n.season) : ""}</small><b>${esc(titleOf(n))}</b></div><button class="x" type="button">Cancel</button><button class="play" type="button">Play</button></div>`;
  box.querySelector(".play").onclick = () => go("play=" + n.id);
  box.querySelector(".x").onclick = hideNext;
  $("#player").append(box);
  const tick = () => { left--; const r = box.querySelector(".ring"); if (r) r.textContent = left; if (left <= 0) go("play=" + n.id); else nextTimer = setTimeout(tick, 1000); };
  nextTimer = setTimeout(tick, 1000);
}
function hideNext() { clearTimeout(nextTimer); $(".next")?.remove(); }
function armIdle() {
  $("#player").classList.remove("idle"); clearTimeout(idleTimer);
  if (current && current.kind === "video") idleTimer = setTimeout(() => { if (media && !media.paused) $("#player").classList.add("idle"); }, 2500);
}
["mousemove", "touchstart", "keydown"].forEach(t => $("#player").addEventListener(t, armIdle, { passive: true }));
document.addEventListener("keydown", e => {
  if (!media || e.target.closest("input, textarea")) return;
  const k = e.key;
  if (k === " " || k === "k") { e.preventDefault(); media.paused ? media.play() : media.pause(); }
  else if (k === "ArrowRight" || k === "l") { media.currentTime = Math.min(media.duration || 0, media.currentTime + 10); }
  else if (k === "ArrowLeft" || k === "j") { media.currentTime = Math.max(0, media.currentTime - 10); }
  else if (k === "f" && media.requestFullscreen) { document.fullscreenElement ? document.exitFullscreen() : media.requestFullscreen(); }
  else if (k === "m") { media.muted = !media.muted; }
  else if (k === "Escape" && !document.fullscreenElement) { $("#back").click(); }
});

// ---- Sync Watch: watch parties (decisions in syncStep / ownEvent above) ----
let party = null;          // {code, token, st, offset, gen}
let partyList = [];        // open parties on this hotspot (the library's shelf)
const PH = { "Content-Type": "application/json", "X-Cinema": "1" };
const VERB = { play: "pressed play", pause: "paused", seek: "skipped", item: "put on something new" };
const boxNow = () => Date.now() + (party ? party.offset : 0);

async function measureClock() {
  const samples = [];
  for (let i = 0; i < 5; i++) {
    const t0 = Date.now();
    try {
      const d = await (await fetch("api/watch/clock", { cache: "no-store" })).json();
      const t1 = Date.now();
      samples.push({ rtt: t1 - t0, offset: d.now - (t0 + t1) / 2 });
    } catch {}
  }
  return samples.length ? clockOffset(samples) : 0;
}
async function partyCall(method, path, body, token = party && party.token, signal) {
  const r = await fetch(path, { method, cache: "no-store", body: body ? JSON.stringify(body) : undefined, signal,
                                headers: { ...PH, ...(token ? { "X-Seat": token } : {}) } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.detail || "Something went wrong."); e.status = r.status; throw e; }
  return d;
}
async function enterParty(code, token, st) {
  const offset = await measureClock();
  party = { code, token, st, offset, gen: Date.now(), ctl: new AbortController() };
  mem.set("party", { code, token });
  renderParty();
  pollParty(party.gen);
}
async function startParty() {
  if (!current || !media) return;
  try {
    const d = await partyCall("POST", "api/watch", { item: current.id, pos: media.currentTime || 0, playing: !media.paused }, null);
    await enterParty(d.code, d.token, d.state);
    openPanel();
  } catch (e) { note(e.message); }
}
async function joinParty(code) {
  if (party && party.code === code) return followItem(party.st) || syncNow();
  if (party) leaveParty();
  const saved = mem.get("party");
  try {
    const d = await partyCall("POST", `api/watch/${code}/join`, { token: saved && saved.code === code ? saved.token : null }, null);
    await enterParty(code, d.token, d.state);
    followItem(d.state, true);
  } catch (e) {
    mem.set("party", null);
    note(e.status === 404 ? "That watch party has ended." : e.message);
    if (location.hash.startsWith("#watch=")) go("");
  }
}
function leaveParty() {
  if (!party) return;
  const p = party;
  party = null;
  mem.set("party", null);
  p.ctl.abort();                        // the long-poll in flight
  fetch(`api/watch/${p.code}/leave`, { method: "POST", headers: { ...PH, "X-Seat": p.token }, keepalive: true }).catch(() => {});
  if (media) media.playbackRate = 1;
  renderParty();
}
async function pollParty(gen) {
  while (party && party.gen === gen) {
    try {
      const st = await partyCall("GET", `api/watch/${party.code}/state?since=${party.st.version}`, null, party.token, party.ctl.signal);
      if (party && party.gen === gen) applyParty(st);
    } catch (e) {
      if (!party || party.gen !== gen) return;
      if (e.status === 404 || e.status === 403) { leaveParty(); note("The watch party has ended."); return; }
      await new Promise(r => setTimeout(r, 2000));          // the box is busy or we're offline: try again
    }
  }
}
function applyParty(st) {
  const prev = party.st;
  if (st.version < prev.version) return;
  party.st = st;
  const me = st.seats.find(s => s.you);
  if (st.last && st.at !== prev.at && (!me || st.last.by !== me.name)) note(`${st.last.by} ${VERB[st.last.type] || ""}`);
  renderParty();
  followItem(st) || syncNow();
}
// The party is on another file: go there (fetching the library first if it's new on Drop).
function followItem(st, replace) {
  if (current && current.id === st.item && !$("#player").hidden) return false;
  const open = () => { if (!byId.has(st.item)) return; replace ? location.replace("#play=" + st.item) : go("play=" + st.item); };
  if (byId.has(st.item)) open(); else load().then(open);
  return true;
}
function partyAct(body) {
  const p = party;
  // assume it worked, so the player events this causes aren't sent back as new actions
  if (body.type === "item") p.st = { ...p.st, item: body.item, pos: 0, playing: true, at: boxNow() };
  else p.st = { ...p.st, playing: body.type === "seek" ? p.st.playing : body.type === "play", pos: body.pos, at: boxNow() };
  partyCall("POST", `api/watch/${p.code}/act`, body).then(st => { if (party === p) applyParty(st); }).catch(e => note(e.message));
}
function tellParty(kind) {
  if (!party || !media || !current || current.id !== party.st.item) return;
  const local = { t: media.currentTime, paused: media.paused, ended: media.ended };
  if (ownEvent(kind, party.st, boxNow(), local)) return;
  partyAct({ type: kind === "seeking" ? "seek" : kind, pos: media.currentTime });
}
function syncNow() {
  if (!party || !media || !current || current.id !== party.st.item || media.readyState < 1) return;
  if (media.ended && party.st.playing) return;          // finished here: up next (or the others) will move us on
  const s = syncStep(party.st, boxNow(), { t: media.currentTime, paused: media.paused, ended: media.ended });
  if (s.seek != null) media.currentTime = isFinite(media.duration) ? Math.min(s.seek, media.duration) : s.seek;
  if (s.pause && !media.paused) media.pause();
  if (s.play) media.play().catch(() => { if (!$("#player .toast")) toast("Tap to join in", "Play", () => media && media.play().catch(() => {})); });
  if (Math.abs(media.playbackRate - s.rate) > 0.004) media.playbackRate = s.rate;
}
setInterval(syncNow, 500);

function renderParty() {
  const b = $("#together");
  b.classList.toggle("on", !!party);
  const here = party ? party.st.seats.filter(s => !s.away).length : 0;
  $("#togetherLbl").textContent = party ? `${here} watching` : "Watch together";
  b.setAttribute("aria-label", party ? `Watch party ${party.code}: ${here} watching` : "Watch together");
  if (!$("#party").hidden) fillPanel();
}
function fillPanel() {
  const box = $("#party");
  if (!party) {
    box.innerHTML = `<h3>Watch together</h3>
      <p>Start a watch party and everyone on this hotspot can join from Cinema's library. Your phones play in step, each with its own sound, so earbuds on.</p>
      <p>Anyone in the party can pause, skip or start the next episode for everyone.</p>
      <div class="acts"><button class="ghost" type="button" data-close>Cancel</button><button class="go" type="button" data-start>Start the party</button></div>`;
    return;
  }
  const st = party.st, me = st.seats.find(s => s.you);
  box.innerHTML = `<h3>Watching together <span class="code">${esc(st.code)}</span></h3>
    <p>Everyone here plays, pauses and skips for everyone. Each phone has its own sound: earbuds on.</p>
    <ul>${st.seats.map(s => `<li class="${s.away ? "away" : ""}"><span class="av">${esc(s.avatar || s.name.slice(0, 1).toUpperCase())}</span><span>${esc(s.name)}${s.you ? " <small>(you)</small>" : ""}${s.away ? " <small>· away</small>" : ""}</span></li>`).join("")}</ul>
    ${me && !me.avatar ? `<p>Others see you as “${esc(me.name)}”. Pick your own name and picture on the <a href="../">AirplaneMode menu</a>.</p>` : ""}
    <div class="acts"><button class="ghost" type="button" data-leave>Leave the party</button><button class="go" type="button" data-close>Done</button></div>`;
}
function openPanel() { $("#party").hidden = false; $("#together").setAttribute("aria-expanded", "true"); fillPanel(); }
function closePanel() { $("#party").hidden = true; $("#together").setAttribute("aria-expanded", "false"); }
$("#together").onclick = () => $("#party").hidden ? openPanel() : closePanel();
$("#party").addEventListener("click", e => {
  if (e.target.closest("[data-start]")) startParty();
  else if (e.target.closest("[data-leave]")) { leaveParty(); closePanel(); }
  else if (e.target.closest("[data-close]")) closePanel();
});
document.querySelector(".pbar a.am-home").addEventListener("click", () => leaveParty());
function note(text) {
  document.querySelector(".toast.fixed")?.remove();
  const t = document.createElement("div");
  t.className = "toast fixed";
  t.innerHTML = `<span>${esc(text)}</span>`;
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}
async function loadParties() {
  try {
    const d = await (await fetch("api/watch", { cache: "no-store" })).json();
    const changed = JSON.stringify(d.parties) !== JSON.stringify(partyList);
    partyList = d.parties || [];
    if (changed && lib && !location.hash.slice(1) && $("#player").hidden) renderHome();
  } catch {}
}
setInterval(() => { if ($("#player").hidden) loadParties(); }, 8000);

// ---- posters: the first browser to see a video grabs a frame and gives it to the box ----
let postering = false;
async function posterQueue() {
  if (postering || !lib) return; postering = true;
  try {
    for (const m of lib.media) {
      if (m.poster || m.kind !== "video" || !playable(m) || mem.get("nop." + m.id)) continue;
      while (!$("#player").hidden) await new Promise(r => setTimeout(r, 3000));   // never compete with playback
      const blob = await grab(m).catch(() => null);
      if (!blob) { mem.set("nop." + m.id, 1); continue; }
      const r = await fetch("api/posters/" + m.id, { method: "PUT", headers: { "X-Cinema": "1", "Content-Type": blob.type }, body: blob }).catch(() => null);
      if (r && r.ok) {
        m.poster = true;
        document.querySelectorAll(`a.card[href="#play=${m.id}"] .poster`).forEach(p => {
          p.querySelector(".ph").innerHTML = "";
          p.insertAdjacentHTML("afterbegin", `<img src="api/posters/${m.id}?v=1" alt="" onload="this.classList.add('on')">`);
        });
      }
    }
  } finally { postering = false; }
}
function grab(m) {
  return new Promise((resolve, reject) => {
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "metadata"; v.crossOrigin = "anonymous";
    const fail = () => { cleanup(); reject(); };
    const timer = setTimeout(fail, 20000);
    const cleanup = () => { clearTimeout(timer); v.removeAttribute("src"); v.load(); };
    v.onerror = fail;
    v.onloadedmetadata = () => { mem.set("d." + m.id, v.duration); v.currentTime = Math.min(Math.max(v.duration * 0.12, 1), 300); };
    v.onseeked = () => {
      try {
        const w = 480, h = Math.round(w * 9 / 16), c = document.createElement("canvas"); c.width = w; c.height = h;
        const ctx = c.getContext("2d"), r = v.videoWidth / v.videoHeight || 16 / 9;
        let sw = v.videoWidth, sh = v.videoHeight, sx = 0, sy = 0;     // cover-crop to 16:9
        if (r > 16 / 9) { sw = sh * 16 / 9; sx = (v.videoWidth - sw) / 2; } else { sh = sw * 9 / 16; sy = (v.videoHeight - sh) / 2; }
        ctx.drawImage(v, sx, sy, sw, sh, 0, 0, w, h);
        c.toBlob(b => { cleanup(); b ? resolve(b) : reject(); }, "image/jpeg", 0.74);
      } catch { fail(); }      // e.g. a cross-origin Drop in standalone dev: no posters, no harm
    };
    v.src = src(m);
  });
}

load();
setInterval(() => { if ($("#player").hidden) load(); }, 30000);   // pick up new files on Drop
</script>
